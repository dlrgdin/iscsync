name: ISC-Termine in DLRG Cloud uebernehmen

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      testlauf:
        description: "Testlauf (nur anzeigen, nichts aendern)?"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abgleich ausfuehren
        env:
          CALDAV_URL: ${{ secrets.CALDAV_URL }}
          CALDAV_USER: ${{ secrets.CALDAV_USER }}
          CALDAV_PASSWORD: ${{ secrets.CALDAV_PASSWORD }}
          TESTLAUF: ${{ inputs.testlauf && '1' || '0' }}
        run: python sync.py
      - name: Terminkalender fuer die Homepage erstellen
        if: ${{ !inputs.testlauf }}
        env:
          CALDAV_URL: ${{ secrets.CALDAV_URL }}
          CALDAV_USER: ${{ secrets.CALDAV_USER }}
          CALDAV_PASSWORD: ${{ secrets.CALDAV_PASSWORD }}
          ABO_LINK: ${{ vars.ABO_LINK }}
        run: python liste.py
      - uses: actions/configure-pages@v5
        if: ${{ !inputs.testlauf }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.testlauf }}
        with:
          path: docs
      - id: deploy
        if: ${{ !inputs.testlauf }}
        uses: actions/deploy-pages@v4
